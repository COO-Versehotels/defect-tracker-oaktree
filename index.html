<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse Defect</title>
<script>
// Web Defect lama sudah digabung ke Verse Defect (satu app untuk 4 unit).
// Halaman ini mengalihkan otomatis ke unit yang sama, membawa parameter asli (mis. SSO Command Center)
// dan ID device lama supaya device yang sudah disetujui tidak perlu approve ulang.
(function(){
  var p = new URLSearchParams(location.search);
  p.set('unit', 'oaktree');
  try { var d = localStorage.getItem('defect_device_id'); if (d) { p.set('prev_dev', d); p.set('prev_app', 'oaktree'); } } catch (e) {}
  location.replace('https://verse-defect.vercel.app/?' + p.toString() + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://verse-defect.vercel.app/?unit=oaktree"></noscript>
</head>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1520;color:#eef4fb;font-family:system-ui,sans-serif;text-align:center;">
<div><div style="font-size:15px;font-weight:700;">Membuka Verse Defect…</div>
<a href="https://verse-defect.vercel.app/?unit=oaktree" style="color:#60a5fa;font-size:13px;">Klik di sini kalau tidak terbuka otomatis</a></div>
</body></html>
